[project]
name = "football-calculator-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=4.1",
  "fastapi>=0.110",
  "httpx>=0.27",
  "paddleocr>=3.5.0",
  "paddlepaddle>=3.3.1",
  "pillow>=12.2.0",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

